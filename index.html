
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>eBook Library</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <style>
        :root {
            --bg-primary: #f4f6f9;
            --bg-card: #ffffff;
            --text-primary: #2c3e50;
            --text-secondary: #7f8c8d;
            --header-bg: #2c3e50;
            --header-text: #ffffff;
            --accent-color: #3498db;
            --border-color: #e0e0e0;
            --modal-bg: rgba(0, 0, 0, 0.7);
        }

        body.dark-mode {
            --bg-primary: #121212;
            --bg-card: #1e1e1e;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --header-bg: #1a252f;
            --header-text: #ffffff;
            --accent-color: #2980b9;
            --border-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        /* ================= HEADER ================= */

        header {
            background-color: var(--header-bg);
            color: var(--header-text);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
        }

        .logo i {
            font-size: 1.4rem;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* ================= SEARCH ================= */

        .search-box {
            position: relative;
            width: 240px;
        }

        .search-box input {
            width: 100%;
            padding: 9px 38px 9px 14px;
            border-radius: 20px;
            border: none;
            outline: none;
            background: #ffffff;
            color: #333333;
        }

        .search-box i {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: #888888;
            pointer-events: none;
        }

        /* ================= BUTTONS ================= */

        .btn-action {
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 9px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            white-space: nowrap;
        }

        .btn-action:hover {
            opacity: 0.9;
        }

        .btn-action:active {
            transform: scale(0.98);
        }

        .btn-admin-status {
            background-color: #27ae60;
        }

        /* ================= MAIN CONTAINER ================= */

        .container {
            display: flex;
            padding: 2rem;
            gap: 2rem;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* ================= FILTERS ================= */

        .filters {
            width: 200px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .filters h3 {
            margin-bottom: 5px;
        }

        .filter-btn {
            padding: 10px 15px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-primary);
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: 0.2s ease;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
        }

        /* ================= BOOK GRID ================= */

        .library-grid {
            flex: 1;
            min-width: 0;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .book-card {
            background: var(--bg-card);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
            min-width: 0;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.15);
        }

        /* ================= BOOK COVER ================= */

        .book-cover {
            width: 100%;
            height: 250px;
            object-fit: cover;
            background-color: #2c3e50;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 15px;
        }

        .book-cover-fallback {
            width: 100%;
            height: 250px;
            background-color: #2c3e50;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 15px;
        }

        .book-cover-fallback i {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .book-cover-fallback strong {
            word-break: break-word;
        }

        /* ================= BOOK INFO ================= */

        .book-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
        }

        .book-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 5px;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        .book-author {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
            word-break: break-word;
        }

        .book-category {
            font-size: 0.75rem;
            background: var(--border-color);
            padding: 3px 8px;
            border-radius: 12px;
            align-self: flex-start;
            margin-top: auto;
            margin-bottom: 10px;
        }

        .card-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-card {
            flex: 1;
            padding: 9px 7px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
            min-width: 0;
        }

        .btn-read {
            background-color: #27ae60;
            color: #ffffff;
        }

        .btn-delete {
            background-color: #e74c3c;
            color: #ffffff;
            flex: 0 0 38px;
        }

        .btn-card:hover {
            opacity: 0.9;
        }

        .btn-card:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* ================= MODALS ================= */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background-color: var(--modal-bg);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 12px;
        }

        .modal-content {
            background: var(--bg-card);
            padding: 25px;
            border-radius: 10px;
            width: 90%;
            max-width: 450px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
            color: var(--text-primary);
        }

        .modal-reader-content {
            background: var(--bg-card);
            width: 90%;
            height: 90vh;
            border-radius: 10px;
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 20px;
            color: var(--text-primary);
        }

        .modal-reader-content iframe {
            width: 100%;
            flex: 1;
            min-height: 0;
            border: none;
            border-radius: 5px;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 18px;
            font-size: 1.7rem;
            cursor: pointer;
            z-index: 2;
        }

        /* ================= FORM ================= */

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--text-primary);
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--accent-color);
        }

        .form-submit {
            width: 100%;
            padding: 10px;
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .form-submit:hover {
            opacity: 0.9;
        }

        /* ================= MESSAGES ================= */

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-secondary);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--accent-color);
        }

        .hint {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 4px;
            line-height: 1.4;
        }

        .error-msg {
            color: #e74c3c;
            font-size: 0.85rem;
            margin-top: 8px;
            display: none;
        }

        .status-msg {
            text-align: center;
            padding: 2rem 1rem;
            color: var(--text-secondary);
            grid-column: 1 / -1;
        }

        /* ================= TABLET ================= */

        @media (max-width: 900px) {

            header {
                padding: 15px;
            }

            .container {
                padding: 1.25rem;
                gap: 1.25rem;
            }

            .filters {
                width: 180px;
            }

            .search-box {
                width: 200px;
            }

            .library-grid {
                grid-template-columns: repeat(
                    auto-fill,
                    minmax(180px, 1fr)
                );
            }
        }

        /* ================= MOBILE ================= */

        @media (max-width: 768px) {

            header {
                padding: 15px;
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }

            .logo {
                justify-content: center;
                font-size: 1.3rem;
            }

            .header-actions {
                width: 100%;
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }

            .search-box {
                width: 100%;
                min-width: 0;
                grid-column: 1 / -1;
            }

            .search-box input {
                padding: 10px 40px 10px 14px;
                font-size: 14px;
            }

            .btn-action {
                width: 100%;
                padding: 10px 8px;
                font-size: 13px;
            }

            #themeToggleBtn {
                min-width: 45px;
            }

            .container {
                flex-direction: column;
                padding: 15px;
                gap: 15px;
            }

            .filters {
                width: 100%;
                display: flex;
                flex-direction: row;
                overflow-x: auto;
                gap: 8px;
                padding-bottom: 5px;
                scrollbar-width: thin;
            }

            .filters h3 {
                display: none;
            }

            .filter-btn {
                flex: 0 0 auto;
                white-space: nowrap;
                padding: 8px 13px;
                font-size: 13px;
                text-align: center;
            }

            .library-grid {
                width: 100%;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
            }

            .book-cover,
            .book-cover-fallback {
                height: 210px;
            }

            .book-info {
                padding: 10px;
            }

            .book-title {
                font-size: 0.95rem;
                line-height: 1.3;
            }

            .book-author {
                font-size: 0.8rem;
                margin-bottom: 8px;
            }

            .book-category {
                font-size: 0.68rem;
                padding: 3px 7px;
            }

            .card-buttons {
                gap: 6px;
            }

            .btn-card {
                padding: 8px 5px;
                font-size: 12px;
            }

            .btn-delete {
                flex: 0 0 35px;
            }

            .modal-content {
                width: calc(100% - 10px);
                max-width: none;
                padding: 20px;
                max-height: 90vh;
            }

            .modal-reader-content {
                width: 100%;
                height: 100%;
                border-radius: 0;
                padding: 15px;
            }
        }

        /* ================= SMALL MOBILE ================= */

        @media (max-width: 400px) {

            .library-grid {
                grid-template-columns: 1fr;
            }

            .book-cover,
            .book-cover-fallback {
                height: 260px;
            }

            .book-title {
                font-size: 1rem;
            }

            .header-actions {
                grid-template-columns: 1fr;
            }

            #themeToggleBtn {
                width: 100%;
            }

            .modal {
                padding: 5px;
            }

            .modal-content {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header>

        <div class="logo">
            <i class="fa-brands fa-google-drive"></i>
            eBook Library
        </div>

        <div class="header-actions">

            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search title or author..."
                    autocomplete="off"
                >
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>

            <button
                class="btn-action"
                id="openAddModalBtn"
                type="button"
            >
                <i class="fa-solid fa-plus"></i>
                Add Book
            </button>

            <button
                class="btn-action"
                id="adminAuthBtn"
                type="button"
            >
                <i class="fa-solid fa-lock"></i>
                Admin Login
            </button>

            <button
                class="btn-action"
                id="themeToggleBtn"
                type="button"
                aria-label="Toggle dark mode"
            >
                <i class="fa-solid fa-moon"></i>
            </button>

        </div>

    </header>


    <!-- ================= MAIN ================= -->

    <div class="container">

        <aside class="filters">

            <h3>Categories</h3>

            <button
                class="filter-btn active"
                data-category="all"
                type="button"
            >
                All Books
            </button>

            <button
                class="filter-btn"
                data-category="Fiction"
                type="button"
            >
                Fiction
            </button>

            <button
                class="filter-btn"
                data-category="Non-Fiction"
                type="button"
            >
                Non-Fiction
            </button>

            <button
                class="filter-btn"
                data-category="Programming"
                type="button"
            >
                Programming
            </button>

            <button
                class="filter-btn"
                data-category="Science"
                type="button"
            >
                Science
            </button>

            <button
                class="filter-btn"
                data-category="Other"
                type="button"
            >
                Other
            </button>

        </aside>

        <main
            class="library-grid"
            id="libraryGrid"
        ></main>

    </div>


    <!-- ================= ADMIN LOGIN MODAL ================= -->

    <div
        class="modal"
        id="loginModal"
        aria-hidden="true"
    >

        <div class="modal-content">

            <span
                class="close-btn"
                id="closeLoginModal"
                title="Close"
            >
                &times;
            </span>

            <h2 style="margin-bottom: 10px;">
                Admin Authentication
            </h2>

            <p
                style="
                    font-size: 0.85rem;
                    color: var(--text-secondary);
                    margin-bottom: 20px;
                "
            >
                Admin login is required to add or delete books.
            </p>

            <form id="loginForm">

                <div class="form-group">

                    <label for="adminUsername">
                        Username
                    </label>

                    <input
                        type="text"
                        id="adminUsername"
                        placeholder="Admin username"
                        autocomplete="username"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="adminPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Admin password"
                        autocomplete="current-password"
                        required
                    >

                </div>

                <div
                    class="error-msg"
                    id="loginError"
                >
                    Invalid admin credentials!
                </div>

                <button
                    type="submit"
                    class="form-submit"
                    style="margin-top: 10px;"
                >
                    Login as Admin
                </button>

            </form>

        </div>

    </div>


    <!-- ================= ADD BOOK MODAL ================= -->

    <div
        class="modal"
        id="addBookModal"
        aria-hidden="true"
    >

        <div class="modal-content">

            <span
                class="close-btn"
                id="closeAddModal"
                title="Close"
            >
                &times;
            </span>

            <h2 style="margin-bottom: 20px;">
                Add Google Drive eBook
            </h2>

            <form id="addBookForm">

                <div class="form-group">

                    <label for="bookTitle">
                        Book Title
                    </label>

                    <input
                        type="text"
                        id="bookTitle"
                        placeholder="e.g. Design Patterns"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="bookAuthor">
                        Author
                    </label>

                    <input
                        type="text"
                        id="bookAuthor"
                        placeholder="e.g. Erich Gamma"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="bookCategory">
                        Category
                    </label>

                    <select id="bookCategory">

                        <option value="Fiction">
                            Fiction
                        </option>

                        <option value="Non-Fiction">
                            Non-Fiction
                        </option>

                        <option value="Programming">
                            Programming
                        </option>

                        <option value="Science">
                            Science
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="driveUrl">
                        Google Drive Shareable Link
                    </label>

                    <input
                        type="url"
                        id="driveUrl"
                        placeholder="https://drive.google.com/file/d/.../view"
                        required
                    >

                    <div class="hint">
                        Set Drive sharing to
                        "Anyone with the link can view".
                    </div>

                </div>


                <div class="form-group">

                    <label for="coverPicUrl">
                        Online Cover Picture Image URL (Optional)
                    </label>

                    <input
                        type="url"
                        id="coverPicUrl"
                        placeholder="https://images.com/cover.jpg"
                    >

                    <div class="hint">
                        Paste a direct image link or leave empty
                        for a default cover.
                    </div>

                </div>


                <div
                    class="error-msg"
                    id="addBookError"
                ></div>


                <button
                    type="submit"
                    class="form-submit"
                    id="saveBookBtn"
                >
                    Save to Library
                </button>

            </form>

        </div>

    </div>


    <!-- ================= READER MODAL ================= -->

    <div
        class="modal"
        id="readerModal"
        aria-hidden="true"
    >

        <div class="modal-reader-content">

            <span
                class="close-btn"
                id="closeReaderModal"
                title="Close"
            >
                &times;
            </span>

            <h2
                id="readerTitle"
                style="margin-bottom: 15px; padding-right: 35px;"
            >
                Reading
            </h2>

            <iframe
                id="driveFrame"
                src=""
                allow="autoplay"
                title="Book Reader"
            ></iframe>

        </div>

    </div>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        /*
        =====================================================
        IMPORTANT
        =====================================================

        Change ONLY this URL when your Render backend URL
        is confirmed.

        Example:

        const API_BASE_URL =
            "https://ebook-library-backend-abnn.onrender.com";

        DO NOT use localhost / 127.0.0.1 on the live website.
        =====================================================
        */

        const API_BASE_URL =
            "https://ebook-library-backend-abnn.onrender.com";


        /* ================= VARIABLES ================= */

        let books = [];

        let isAdminLoggedIn =
            Boolean(localStorage.getItem("admin_token"));

        let activeCategory = "all";

        let pendingAction = null;


        /* ================= ELEMENTS ================= */

        const libraryGrid =
            document.getElementById("libraryGrid");

        const searchInput =
            document.getElementById("searchInput");

        const filterBtns =
            document.querySelectorAll(".filter-btn");

        const themeToggleBtn =
            document.getElementById("themeToggleBtn");

        const adminAuthBtn =
            document.getElementById("adminAuthBtn");

        const loginModal =
            document.getElementById("loginModal");

        const closeLoginModal =
            document.getElementById("closeLoginModal");

        const loginForm =
            document.getElementById("loginForm");

        const loginError =
            document.getElementById("loginError");

        const addBookModal =
            document.getElementById("addBookModal");

        const openAddModalBtn =
            document.getElementById("openAddModalBtn");

        const closeAddModal =
            document.getElementById("closeAddModal");

        const addBookForm =
            document.getElementById("addBookForm");

        const addBookError =
            document.getElementById("addBookError");

        const saveBookBtn =
            document.getElementById("saveBookBtn");

        const readerModal =
            document.getElementById("readerModal");

        const closeReaderModal =
            document.getElementById("closeReaderModal");

        const driveFrame =
            document.getElementById("driveFrame");

        const readerTitle =
            document.getElementById("readerTitle");


        /* ================= ESCAPE HTML ================= */

        function escapeHtml(value) {

            return String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }


        /* ================= ADMIN UI ================= */

        function updateAdminUI() {

            if (isAdminLoggedIn) {

                adminAuthBtn.innerHTML =
                    `
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Logout Admin
                    `;

                adminAuthBtn.classList.add(
                    "btn-admin-status"
                );

            } else {

                adminAuthBtn.innerHTML =
                    `
                    <i class="fa-solid fa-lock"></i>
                    Admin Login
                    `;

                adminAuthBtn.classList.remove(
                    "btn-admin-status"
                );
            }
        }


        /* ================= MODAL FUNCTIONS ================= */

        function openModal(modal) {

            modal.style.display = "flex";
            modal.setAttribute(
                "aria-hidden",
                "false"
            );
        }


        function closeModal(modal) {

            modal.style.display = "none";
            modal.setAttribute(
                "aria-hidden",
                "true"
            );
        }


        /* ================= GOOGLE DRIVE URL ================= */

        function formatGoogleDriveEmbedUrl(url) {

            const fileIdMatch =
                url.match(/\/d\/([a-zA-Z0-9_-]+)/) ||
                url.match(/[?&]id=([a-zA-Z0-9_-]+)/);

            if (
                fileIdMatch &&
                fileIdMatch[1]
            ) {

                return (
                    `https://drive.google.com/file/d/` +
                    `${fileIdMatch[1]}/preview`
                );
            }

            return url;
        }


        /* ================= LOAD BOOKS ================= */

        async function loadBooks() {

            libraryGrid.innerHTML =
                `
                <div class="status-msg">

                    <i class="fa-solid fa-spinner fa-spin"></i>

                    <p style="margin-top:10px;">
                        Loading books...
                    </p>

                </div>
                `;

            try {

                const response =
                    await fetch(
                        `${API_BASE_URL}/api/books`
                    );

                const result =
                    await response.json();

                if (
                    !response.ok ||
                    !result.success
                ) {

                    throw new Error(
                        result.message ||
                        "Could not load books."
                    );
                }

                books =
                    Array.isArray(result.data)
                        ? result.data
                        : [];

                renderBooks();

            } catch (error) {

                console.error(
                    "Load books error:",
                    error
                );

                libraryGrid.innerHTML =
                    `
                    <div class="empty-state">

                        <i class="fa-solid fa-server"></i>

                        <h3>
                            Could not connect to server
                        </h3>

                        <p style="margin-top:8px;">
                            Please check the backend server.
                        </p>

                    </div>
                    `;
            }
        }


        /* ================= RENDER BOOKS ================= */

        function renderBooks() {

            libraryGrid.innerHTML = "";

            const searchTerm =
                searchInput.value
                    .toLowerCase()
                    .trim();

            const filteredBooks =
                books.filter(book => {

                    const matchesCategory =
                        activeCategory === "all" ||
                        String(
                            book.category || ""
                        ) === activeCategory;

                    const matchesSearch =
                        String(
                            book.title || ""
                        )
                        .toLowerCase()
                        .includes(searchTerm)

                        ||

                        String(
                            book.author || ""
                        )
                        .toLowerCase()
                        .includes(searchTerm);

                    return (
                        matchesCategory &&
                        matchesSearch
                    );
                });


            if (filteredBooks.length === 0) {

                libraryGrid.innerHTML =
                    `
                    <div class="empty-state">

                        <i class="fa-solid fa-book-open"></i>

                        <h3>
                            No Books Available
                        </h3>

                        <p style="margin-top:8px;">
                            Click "Add Book" to add a
                            Google Drive PDF.
                        </p>

                    </div>
                    `;

                return;
            }


            filteredBooks.forEach(book => {

                const bookCard =
                    document.createElement("div");

                bookCard.className =
                    "book-card";


                const safeTitle =
                    escapeHtml(book.title);

                const safeAuthor =
                    escapeHtml(book.author);

                const safeCategory =
                    escapeHtml(book.category);


                let coverElement;


                if (book.cover) {

                    const safeCover =
                        escapeHtml(book.cover);

                    coverElement =
                        `
                        <img
                            src="${safeCover}"
                            class="book-cover"
                            alt="${safeTitle}"
                            loading="lazy"
                            onerror="
                                this.onerror=null;
                                this.style.display='none';
                                this.nextElementSibling.style.display='flex';
                            "
                        >

                        <div
                            class="book-cover-fallback"
                            style="display:none;"
                        >

                            <i class="fa-solid fa-book"></i>

                            <strong>
                                ${safeTitle}
                            </strong>

                            <small
                                style="
                                    opacity:0.8;
                                    margin-top:5px;
                                "
                            >
                                ${safeAuthor}
                            </small>

                        </div>
                        `;

                } else {

                    coverElement =
                        `
                        <div class="book-cover-fallback">

                            <i class="fa-solid fa-book"></i>

                            <strong>
                                ${safeTitle}
                            </strong>

                            <small
                                style="
                                    opacity:0.8;
                                    margin-top:5px;
                                "
                            >
                                ${safeAuthor}
                            </small>

                        </div>
                        `;
                }


                const bookId =
                    escapeHtml(book._id);


                bookCard.innerHTML =
                    `
                    ${coverElement}

                    <div class="book-info">

                        <div class="book-title">
                            ${safeTitle}
                        </div>

                        <div class="book-author">
                            by ${safeAuthor}
                        </div>

                        <span class="book-category">
                            ${safeCategory}
                        </span>

                        <div class="card-buttons">

                            <button
                                class="btn-card btn-read"
                                type="button"
                                onclick="openReader('${bookId}')"
                            >

                                <i class="fa-solid fa-book-open"></i>

                                Read

                            </button>

                            <button
                                class="btn-card btn-delete"
                                type="button"
                                onclick="handleDeleteClick('${bookId}')"
                                aria-label="Delete book"
                            >

                                <i class="fa-solid fa-trash"></i>

                            </button>

                        </div>

                    </div>
                    `;


                libraryGrid.appendChild(
                    bookCard
                );
            });
        }


        /* ================= CATEGORY FILTER ================= */

        filterBtns.forEach(btn => {

            btn.addEventListener(
                "click",
                () => {

                    document
                        .querySelector(
                            ".filter-btn.active"
                        )
                        ?.classList.remove(
                            "active"
                        );

                    btn.classList.add(
                        "active"
                    );

                    activeCategory =
                        btn.getAttribute(
                            "data-category"
                        );

                    renderBooks();
                }
            );
        });


        /* ================= SEARCH ================= */

        searchInput.addEventListener(
            "input",
            renderBooks
        );


        /* ================= OPEN ADD MODAL ================= */

        openAddModalBtn.addEventListener(
            "click",
            () => {

                if (!isAdminLoggedIn) {

                    pendingAction =
                        () => {

                            openModal(
                                addBookModal
                            );
                        };

                    loginError.style.display =
                        "none";

                    openModal(
                        loginModal
                    );

                } else {

                    openModal(
                        addBookModal
                    );
                }
            }
        );


        /* ================= DELETE CLICK ================= */

        function handleDeleteClick(id) {

            if (!isAdminLoggedIn) {

                pendingAction =
                    () => deleteBook(id);

                loginError.style.display =
                    "none";

                openModal(
                    loginModal
                );

            } else {

                deleteBook(id);
            }
        }


        /* ================= DELETE BOOK ================= */

        async function deleteBook(id) {

            if (
                !confirm(
                    "Are you sure you want to delete this book?"
                )
            ) {
                return;
            }


            const token =
                localStorage.getItem(
                    "admin_token"
                );


            try {

                const response =
                    await fetch(
                        `${API_BASE_URL}/api/books/${id}`,
                        {
                            method: "DELETE",

                            headers: {
                                "Authorization":
                                    `Bearer ${token}`
                            }
                        }
                    );


                const result =
                    await response.json();


                if (response.status === 401) {

                    logoutAdmin();

                    alert(
                        "Your admin session has expired. Please login again."
                    );

                    return;
                }


                if (
                    !response.ok ||
                    !result.success
                ) {

                    throw new Error(
                        result.message ||
                        "Delete failed."
                    );
                }


                await loadBooks();

            } catch (error) {

                console.error(
                    "Delete error:",
                    error
                );

                alert(
                    error.message ||
                    "Could not delete the book."
                );
            }
        }


        /* ================= ADMIN LOGIN BUTTON ================= */

        adminAuthBtn.addEventListener(
            "click",
            () => {

                if (isAdminLoggedIn) {

                    if (
                        confirm(
                            "Logout from Admin account?"
                        )
                    ) {

                        logoutAdmin();
                    }

                } else {

                    pendingAction = null;

                    loginError.style.display =
                        "none";

                    openModal(
                        loginModal
                    );
                }
            }
        );


        /* ================= LOGOUT ================= */

        function logoutAdmin() {

            localStorage.removeItem(
                "admin_token"
            );

            isAdminLoggedIn = false;

            updateAdminUI();
        }


        /* ================= LOGIN ================= */

        loginForm.addEventListener(
            "submit",
            async (e) => {

                e.preventDefault();

                loginError.style.display =
                    "none";


                const user =
                    document
                        .getElementById(
                            "adminUsername"
                        )
                        .value
                        .trim();


                const pass =
                    document
                        .getElementById(
                            "adminPassword"
                        )
                        .value;


                try {

                    const response =
                        await fetch(
                            `${API_BASE_URL}/api/login`,
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    username: user,
                                    password: pass
                                })
                            }
                        );


                    const result =
                        await response.json();


                    if (
                        !response.ok ||
                        !result.success
                    ) {

                        loginError.textContent =
                            result.message ||
                            "Invalid admin credentials!";

                        loginError.style.display =
                            "block";

                        return;
                    }


                    localStorage.setItem(
                        "admin_token",
                        result.token
                    );


                    isAdminLoggedIn = true;


                    loginForm.reset();


                    closeModal(
                        loginModal
                    );


                    updateAdminUI();


                    if (pendingAction) {

                        const action =
                            pendingAction;

                        pendingAction = null;

                        action();
                    }

                } catch (error) {

                    console.error(
                        "Login error:",
                        error
                    );

                    loginError.textContent =
                        "Could not connect to the backend server.";

                    loginError.style.display =
                        "block";
                }
            }
        );


        /* ================= ADD BOOK ================= */

        addBookForm.addEventListener(
            "submit",
            async (e) => {

                e.preventDefault();


                addBookError.style.display =
                    "none";


                saveBookBtn.disabled = true;

                saveBookBtn.innerHTML =
                    `
                    <i class="fa-solid fa-spinner fa-spin"></i>
                    Saving...
                    `;


                const title =
                    document
                        .getElementById(
                            "bookTitle"
                        )
                        .value
                        .trim();


                const author =
                    document
                        .getElementById(
                            "bookAuthor"
                        )
                        .value
                        .trim();


                const category =
                    document
                        .getElementById(
                            "bookCategory"
                        )
                        .value;


                const rawDriveUrl =
                    document
                        .getElementById(
                            "driveUrl"
                        )
                        .value
                        .trim();


                const coverUrl =
                    document
                        .getElementById(
                            "coverPicUrl"
                        )
                        .value
                        .trim();


                const embedUrl =
                    formatGoogleDriveEmbedUrl(
                        rawDriveUrl
                    );


                try {

                    const token =
                        localStorage.getItem(
                            "admin_token"
                        );


                    if (!token) {

                        throw new Error(
                            "Please login as admin first."
                        );
                    }


                    const response =
                        await fetch(
                            `${API_BASE_URL}/api/books`,
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json",

                                    "Authorization":
                                        `Bearer ${token}`
                                },

                                body: JSON.stringify({
                                    title,
                                    author,
                                    category,
                                    embedUrl,
                                    cover:
                                        coverUrl ||
                                        null
                                })
                            }
                        );


                    const result =
                        await response.json();


                    if (response.status === 401) {

                        logoutAdmin();

                        throw new Error(
                            "Admin session expired. Please login again."
                        );
                    }


                    if (
                        !response.ok ||
                        !result.success
                    ) {

                        throw new Error(
                            result.message ||
                            "Could not save book."
                        );
                    }


                    addBookForm.reset();


                    closeModal(
                        addBookModal
                    );


                    await loadBooks();

                } catch (error) {

                    console.error(
                        "Add book error:",
                        error
                    );

                    addBookError.textContent =
                        error.message ||
                        "Could not save the book.";

                    addBookError.style.display =
                        "block";

                } finally {

                    saveBookBtn.disabled =
                        false;

                    saveBookBtn.innerHTML =
                        "Save to Library";
                }
            }
        );


        /* ================= OPEN READER ================= */

        function openReader(id) {

            const book =
                books.find(
                    b => String(b._id) === String(id)
                );


            if (!book) {
                return;
            }


            readerTitle.textContent =
                book.title || "Reading";


            let readerUrl =
                book.embedUrl;


            if (!readerUrl) {

                alert(
                    "This book does not have a valid reading link."
                );

                return;
            }


            readerUrl =
                formatGoogleDriveEmbedUrl(
                    readerUrl
                );


            driveFrame.src =
                readerUrl;


            openModal(
                readerModal
            );
        }


        /* ================= CLOSE LOGIN ================= */

        closeLoginModal.onclick =
            () => {

                closeModal(
                    loginModal
                );
            };


        /* ================= CLOSE ADD ================= */

        closeAddModal.onclick =
            () => {

                closeModal(
                    addBookModal
                );
            };


        /* ================= CLOSE READER ================= */

        closeReaderModal.onclick =
            () => {

                closeModal(
                    readerModal
                );

                driveFrame.src = "";
            };


        /* ================= CLICK OUTSIDE MODAL ================= */

        window.onclick =
            (e) => {

                if (
                    e.target === loginModal
                ) {

                    closeModal(
                        loginModal
                    );
                }


                if (
                    e.target === addBookModal
                ) {

                    closeModal(
                        addBookModal
                    );
                }


                if (
                    e.target === readerModal
                ) {

                    closeModal(
                        readerModal
                    );

                    driveFrame.src = "";
                }
            };


        /* ================= ESC KEY ================= */

        document.addEventListener(
            "keydown",
            (e) => {

                if (e.key !== "Escape") {
                    return;
                }


                if (
                    loginModal.style.display ===
                    "flex"
                ) {

                    closeModal(
                        loginModal
                    );
                }


                if (
                    addBookModal.style.display ===
                    "flex"
                ) {

                    closeModal(
                        addBookModal
                    );
                }


                if (
                    readerModal.style.display ===
                    "flex"
                ) {

                    closeModal(
                        readerModal
                    );

                    driveFrame.src = "";
                }
            }
        );


        /* ================= DARK MODE ================= */

        if (
            localStorage.getItem(
                "theme_mode"
            ) === "dark"
        ) {

            document.body.classList.add(
                "dark-mode"
            );

            themeToggleBtn.innerHTML =
                `
                <i class="fa-solid fa-sun"></i>
                `;
        }


        themeToggleBtn.addEventListener(
            "click",
            () => {

                document.body.classList.toggle(
                    "dark-mode"
                );


                const isDark =
                    document.body.classList.contains(
                        "dark-mode"
                    );


                localStorage.setItem(
                    "theme_mode",
                    isDark
                        ? "dark"
                        : "light"
                );


                themeToggleBtn.innerHTML =
                    isDark

                        ? `
                          <i class="fa-solid fa-sun"></i>
                          `

                        : `
                          <i class="fa-solid fa-moon"></i>
                          `;
            }
        );


        /* ================= START ================= */

        updateAdminUI();

        loadBooks();

    </script>

</body>

</html>
